{% extends "base.html" %} {% block title %}{{ page.title }} | {{ SITENAME }}{%
endblock %} {% block content %}
<div class="intro-header w-clearfix">
    {% if page.header_image %}
    <img
        src="{{ SITEURL }}/images/{{ page.header_image }}"
        loading="lazy"
        alt="{{ page.header_image_alt }}"
        class="header-image"
    />
    {% endif %}
    <div class="heading-jumbo">Alongside Live-In Home Support Services</div>
</div>

{% if page.subtitle %}
<div class="motto-wrap">
    <div class="heading-jumbo-small">{{ page.subtitle }}</div>
</div>
{% endif %}

<div class="home-content-wrap">{{ page.content }}</div>
{% endblock %}
