{% extends "base.html" %}
{% block title %}{{ page.title }} | {{ SITENAME }}{% endblock %}

{% block content %}
<style>
    .faq-layout {
        display: flex;
        gap: 40px;
        margin-top: 40px;
        align-items: flex-start;
    }

    /* Table of Contents */
    .faq-toc {
        flex: 0 0 250px;
        position: sticky;
        top: 100px;
        background: #f8f9fa;
        padding: 20px;
        border-radius: 8px;
        border: 1px solid #eee;
    }

    .faq-toc h3 {
        font-size: 16px;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 15px;
        color: #333;
        border-bottom: 2px solid #53e477;
        padding-bottom: 8px;
    }

    .faq-toc ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .faq-toc li {
        margin-bottom: 10px;
    }

    .faq-toc a {
        text-decoration: none;
        color: #666;
        font-size: 14px;
        font-weight: 500;
        transition: color 0.2s;
    }

    .faq-toc a:hover {
        color: #53e477;
    }

    /* Accordion Styles */
    .faq-content {
        flex: 1;
    }

    .faq-section {
        margin-bottom: 40px;
    }

    .faq-section h3 {
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 1px solid #eee;
    }

    .accordion-item {
        border: 1px solid #e2e2e2;
        border-radius: 4px;
        margin-bottom: 10px;
        overflow: hidden;
    }

    .accordion-header {
        background: #fff;
        padding: 18px 25px;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: background 0.3s;
        user-select: none;
    }

    .accordion-header h4 {
        margin: 0 !important;
        font-size: 18px !important;
        color: #333;
        font-weight: 600;
    }

    .accordion-header:hover {
        background: #f9f9f9;
    }

    .accordion-header::after {
        content: '+';
        font-size: 24px;
        color: #53e477;
        font-weight: bold;
        transition: transform 0.3s;
    }

    .accordion-item.active .accordion-header::after {
        content: '−';
        transform: rotate(180deg);
    }

    .accordion-item.active .accordion-header {
        border-bottom: 1px solid #eee;
        background: #fdfdfd;
    }

    .accordion-panel {
        padding: 0 25px;
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease-out, padding 0.3s ease;
        background: #fff;
    }

    .accordion-item.active .accordion-panel {
        padding: 20px 25px;
        max-height: 1000px; /* Large enough to contain content */
    }

    @media screen and (max-width: 991px) {
        .faq-layout {
            flex-direction: column;
        }
        .faq-toc {
            position: static;
            width: 100%;
            flex: none;
            margin-bottom: 30px;
        }
    }
</style>

<div class="intro-header w-clearfix">
    <img src="{{ SITEURL }}/images/alongside-website-photo.jpg" loading="lazy" alt="Frequently Asked Questions" class="header-image">
    <div class="heading-jumbo">{{ page.title }}</div>
</div>

<div class="motto-wrap">
    <div class="heading-jumbo-small">Common questions about our live-in home support services and how we can help your family.</div>
</div>

<div class="faq-layout">
    <aside class="faq-toc">
        <h3>Sections</h3>
        <ul id="toc-list">
            <!-- Populated via JavaScript -->
        </ul>
    </aside>

    <div class="faq-content" id="faq-transformed-content">
        {{ page.content }}
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const contentArea = document.getElementById('faq-transformed-content');
        const tocList = document.getElementById('toc-list');

        // 1. Group content into sections based on H3
        // 2. Transform H4 into Accordions

        const rawElements = Array.from(contentArea.children);
        contentArea.innerHTML = ''; // Clear for rebuild

        let currentSection = null;
        let currentPanel = null;

        rawElements.forEach((el, index) => {
            if (el.tagName === 'H3') {
                // Create new section
                const sectionId = 'section-' + index;
                el.id = sectionId;

                // Add to TOC
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = '#' + sectionId;
                a.textContent = el.textContent;
                li.appendChild(a);
                tocList.appendChild(li);

                currentSection = document.createElement('div');
                currentSection.className = 'faq-section';
                currentSection.appendChild(el);
                contentArea.appendChild(currentSection);
            } else if (el.tagName === 'H4') {
                // Create new Accordion Item
                const item = document.createElement('div');
                item.className = 'accordion-item';

                const header = document.createElement('div');
                header.className = 'accordion-header';
                header.appendChild(el);

                const panel = document.createElement('div');
                panel.className = 'accordion-panel';
                currentPanel = panel;

                item.appendChild(header);
                item.appendChild(panel);

                if (currentSection) {
                    currentSection.appendChild(item);
                } else {
                    contentArea.appendChild(item);
                }

                header.addEventListener('click', () => {
                    item.classList.toggle('active');
                });
            } else if (currentPanel) {
                // Add content to the current accordion panel
                currentPanel.appendChild(el);
            } else if (currentSection) {
                // Add non-accordion content to current section (e.g. intro text)
                currentSection.appendChild(el);
            } else {
                // Top level content
                contentArea.appendChild(el);
            }
        });
    });
</script>
{% endblock %}
