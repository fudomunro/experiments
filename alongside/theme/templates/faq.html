{% extends "base.html" %}
{% block title %}{{ page.title }} | {{ SITENAME }}{% endblock %}

{% block content %}

<div class="intro-header w-clearfix">
    <img src="{{ SITEURL }}/images/alongside-website-photo.jpg" loading="lazy" alt="Frequently Asked Questions" class="header-image">
    <div class="heading-jumbo">{{ page.title }}</div>
</div>

<div class="motto-wrap">
    <div class="heading-jumbo-small">Common questions about our live-in home support services and how we can help your family.</div>
</div>

<div class="faq-layout">
    <aside class="faq-toc">
        <h3>Sections</h3>
        <ul id="toc-list">
            <!-- Populated via JavaScript -->
        </ul>
    </aside>

    <div class="faq-content" id="faq-transformed-content">
        {{ page.content }}
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const contentArea = document.getElementById('faq-transformed-content');
        const tocList = document.getElementById('toc-list');

        // 1. Group content into sections based on H3
        // 2. Transform H4 into Accordions

        const rawElements = Array.from(contentArea.children);
        contentArea.innerHTML = ''; // Clear for rebuild

        let currentSection = null;
        let currentPanel = null;

        rawElements.forEach((el, index) => {
            if (el.tagName === 'H3') {
                // Create new section
                const sectionId = 'section-' + index;
                el.id = sectionId;

                // Add to TOC
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = '#' + sectionId;
                a.textContent = el.textContent;
                li.appendChild(a);
                tocList.appendChild(li);

                currentSection = document.createElement('div');
                currentSection.className = 'faq-section';
                currentSection.appendChild(el);
                contentArea.appendChild(currentSection);
            } else if (el.tagName === 'H4') {
                // Create new Accordion Item
                const item = document.createElement('div');
                item.className = 'accordion-item';

                const header = document.createElement('div');
                header.className = 'accordion-header';
                header.appendChild(el);

                const panel = document.createElement('div');
                panel.className = 'accordion-panel';
                currentPanel = panel;

                item.appendChild(header);
                item.appendChild(panel);

                if (currentSection) {
                    currentSection.appendChild(item);
                } else {
                    contentArea.appendChild(item);
                }

                header.addEventListener('click', () => {
                    item.classList.toggle('active');
                });
            } else if (currentPanel) {
                // Add content to the current accordion panel
                currentPanel.appendChild(el);
            } else if (currentSection) {
                // Add non-accordion content to current section (e.g. intro text)
                currentSection.appendChild(el);
            } else {
                // Top level content
                contentArea.appendChild(el);
            }
        });
    });
</script>
{% endblock %}
